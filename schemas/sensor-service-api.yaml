openapi: 3.0.3
info:
  title: Sensor Management Service API
  description: API для управления датчиками умного дома
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер
  - url: http://sensor-service:8080/api/v1
    description: Production сервер

paths:
  /sensors:
    get:
      summary: Получить список всех датчиков
      operationId: getSensors
      tags:
        - Sensors
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      summary: Создать новый датчик
      operationId: createSensor
      tags:
        - Sensors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '201':
          description: Датчик успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}:
    get:
      summary: Получить датчик по ID
      operationId: getSensorById
      tags:
        - Sensors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID датчика
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Обновить датчик
      operationId: updateSensor
      tags:
        - Sensors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID датчика
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdate'
      responses:
        '200':
          description: Датчик успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Удалить датчик
      operationId: deleteSensor
      tags:
        - Sensors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID датчика
      responses:
        '200':
          description: Датчик успешно удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sensors/{id}/value:
    patch:
      summary: Обновить значение датчика
      operationId: updateSensorValue
      tags:
        - Sensors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID датчика
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
                - status
              properties:
                value:
                  type: number
                  format: float
                status:
                  type: string
      responses:
        '200':
          description: Значение успешно обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Sensor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [temperature, humidity, motion, light]
        location:
          type: string
        value:
          type: number
          format: float
        unit:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
        last_updated:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    
    SensorCreate:
      type: object
      required:
        - name
        - type
        - location
      properties:
        name:
          type: string
        type:
          type: string
          enum: [temperature, humidity, motion, light]
        location:
          type: string
        unit:
          type: string
    
    SensorUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [temperature, humidity, motion, light]
        location:
          type: string
        value:
          type: number
          format: float
        unit:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
    
    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке


