server:
  port: 8083

spring:
  application:
    name: device-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/${DATABASE_NAME:deviceservice}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database: postgresql

  rabbitmq:
    addresses: "amqp://${MQ_USER:rabbit}:${MQ_PASSWORD:password}@${MQ_HOST:localhost}:${MQ_PORT:5672}"
    template:
      retry:
        enabled: false
        initial-interval: "2s"
